name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The matrix that was previously only ever run by hand. Release + ASan cover
  # the unit suite; the e2e corpus runs in all three modes because chunk-boundary
  # and reopen bugs only surface in the small-vector and durable runs.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            build_dir: build
            build_jobs: 2
          - name: asan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DSANITIZER=address
            build_dir: build-asan
            build_jobs: 2
          - name: tsan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DSANITIZER=thread
            build_dir: build-tsan
            build_jobs: 2
          # UBSan has never been run against this codebase (refactor.md W12).
          # CMakeLists passes -DSANITIZER straight to -fsanitize, so no build
          # change is needed. Advisory until the first findings are triaged.
          - name: ubsan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DSANITIZER=undefined
            build_dir: build-ubsan
            build_jobs: 1
            advisory: true
          - name: small-vector
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DBBDB_VECTOR_SIZE=4
            build_dir: build-smallvec
            build_jobs: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev ninja-build
      - name: Install Python test dependencies
        if: matrix.name == 'release' || matrix.name == 'small-vector'
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Configure
        run: cmake -S . -B ${{ matrix.build_dir }} -G Ninja ${{ matrix.cmake_args }}
      - name: Build
        # Ninja defaults to more workers than the two-vCPU hosted runner can sustain for these
        # template-heavy translation units. The resulting memory pressure has terminated release
        # builds with SIGTERM and made sanitizer runners lose contact with GitHub.
        run: cmake --build ${{ matrix.build_dir }} --parallel ${{ matrix.build_jobs }}
      # Unit tests assume STANDARD_VECTOR_SIZE == 1024, so the small-vector build
      # runs only the e2e corpus (see CLAUDE.md).
      - name: Unit tests
        if: matrix.name != 'small-vector' && matrix.name != 'tsan'
        continue-on-error: ${{ matrix.advisory == true }}
        run: ./${{ matrix.build_dir }}/unit_tests
      - name: Unit tests (TSan, fail fast)
        if: matrix.name == 'tsan'
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./${{ matrix.build_dir }}/unit_tests
      - name: E2E
        if: matrix.name == 'release'
        run: python3 -m pytest test/e2e -q
      - name: E2E (durable)
        if: matrix.name == 'release'
        run: BBDB_SLT_DURABLE=1 python3 -m pytest test/e2e -q
      - name: E2E (small vector)
        if: matrix.name == 'small-vector'
        run: BBDB_SLT_BIN=${{ matrix.build_dir }}/BumbleBee BBDB_SLT_SMALL_VECTOR=1 python3 -m pytest test/e2e -q

  # Build an actual wheel for every first-release CPython/platform pair, install that artifact, and
  # run the public API plus the in-process SQL corpus. Linux 3.12 also runs the durable/restart mode.
  python-wheel:
    name: wheel (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - name: Install system build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev ninja-build
      - name: Install wheel and test tooling
        run: python -m pip install --disable-pip-version-check build twine pytest numpy pandas
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install built artifact
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Import and metadata smoke test
        run: python -c "import importlib.metadata, bumblebeedb; assert bumblebeedb.__version__ == importlib.metadata.version('bumblebeedb')"
      - name: Python tests and in-process SQL corpus
        run: python -m pytest python/test -q
      - name: Python durable/restart corpus
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: BBDB_PY_SLT_DURABLE=1 python -m pytest python/test/e2e/test_slt_python.py -q

  # STANDARD_VECTOR_SIZE is compiled into the extension. This independent wheel proves the Python
  # result/DataFrame paths and direct SQL adapter against the production code at width four.
  python-small-vector:
    name: wheel (small-vector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y uuid-dev ninja-build
          python -m pip install --disable-pip-version-check build pytest numpy pandas
      - name: Build and install small-vector wheel
        env:
          CMAKE_ARGS: -DBBDB_VECTOR_SIZE=4
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Small-vector Python matrix
        env:
          BBDB_PY_SLT_SMALL_VECTOR: '1'
        run: |
          python -m pytest python/test/e2e/test_slt_python.py -q
          python -m pytest python/test/test_result.py python/test/test_result_types.py python/test/test_dataframe.py python/test/test_dataframe_types.py -q

  # ---------------------------------------------------------------------------
  # Style. Scoped to lines the PR actually changes: the tree still carries ~700
  # lines of pre-existing formatting drift (refactor.md W1), so a whole-tree gate
  # would be red on arrival and teach everyone to ignore it.
  # ---------------------------------------------------------------------------
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting of changed lines
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          git-clang-format --diff "$base" -- \
            $(git diff --name-only "$base" -- 'src/*' 'test/*' 'python/src/*' \
              | grep -E '\.(cpp|h)$' || true) > fmt.diff || true
          if [ -s fmt.diff ] && ! grep -q "no modified files\|did not modify" fmt.diff; then
            echo "::error::clang-format would change these lines:"; cat fmt.diff; exit 1
          fi
          echo "formatting OK"

  # ---------------------------------------------------------------------------
  # clang-tidy. Advisory on its first outing: .clang-tidy was tuned against a
  # 12-file sample on macOS, so the Linux toolchain may surface checks the sample
  # missed. Flip continue-on-error off once a clean baseline is confirmed.
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy (changed files, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy uuid-dev ninja-build
      - name: Configure (for compile_commands.json)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build generated sources only
        run: cmake --build build -j --target duckdb_pg_query
      - name: Run clang-tidy on changed files
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          files=$(git diff --name-only "$base" -- 'src/*' | grep -E '\.cpp$' || true)
          [ -z "$files" ] && { echo "no C++ sources changed"; exit 0; }
          echo "$files" | xargs -r clang-tidy -p build --quiet
