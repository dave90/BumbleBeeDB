[pytest]
testpaths = test
addopts = -ra
markers =
    memory: in-memory database behavior
    durable: durable file-backed database behavior
    small_vector: requires a build with a reduced STANDARD_VECTOR_SIZE
    concurrency: true multi-threaded or lifecycle-overlap behavior
    slow: intentionally long-running stress or corpus coverage
    gil: verifies that native work does not hold the Python GIL
